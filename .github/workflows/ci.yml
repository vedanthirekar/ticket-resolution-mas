name: quality

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: luma
          POSTGRES_USER: luma
          POSTGRES_PASSWORD: luma_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luma -d luma"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      LUMA_DATABASE_URL: postgresql+psycopg://luma:luma_dev_only@localhost:5432/luma
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --dev --frozen
      - run: uv run alembic upgrade head
      - run: uv run luma-generate-enterprise --no-write-manifests
      - run: uv run luma-index-policies
      - run: uv run luma-agent --setup-checkpoints
      - run: uv run python evals/run_policy_retrieval.py
      - run: uv run luma-eval
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -m "not live_model" -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
